services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: [ "${POSTGRES_PORT}:5432" ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tinker -d vectors" ]
      interval: 5s
      timeout: 3s
      retries: 10

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9
    command:
      - --model-id=BAAI/bge-small-en-v1.5
      - --auto-truncate
      - --max-batch-tokens=8192
      - --max-concurrent-requests=64
    ports:
      - "${TEI_PORT}:80"
    volumes:
      - hf-cache:/data
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [ "migrations" ]
    environment:
      PGOPTIONS: "-c lock_timeout=${MIGRATE_LOCK_TIMEOUT:-5}s"
    volumes:
      - ${PROJECT_ROOT:-.}/processing/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
